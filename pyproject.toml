[project]
name = "whsport"
version = "0.1.0"
description = "运动世界校园 App (v7.3.90) 纯 Python 协议实现"
readme = "README.md"
authors = [
    { name = "ACG-j", email = "ACG-j@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.22.0",
    "opencv-python>=4.8.0",
    "pillow>=9.0.0",
    "playwright>=1.40.0",
    "pycryptodome>=3.18.0",
    "requests>=2.28.0",
]

[project.scripts]
whsport = "whsport.__main__:main"
wh-login = "whsport.cli.login_cli:main"
wh-run = "whsport.cli.run_cli:main"
wh-indoor = "whsport.cli.indoor_cli:main"
wh-score = "whsport.cli.score_cli:main"
wh-policy = "whsport.cli.policy_cli:main"
wh-history = "whsport.cli.history_cli:main"
wh-rank = "whsport.cli.rank_cli:main"
wh-gui = "whsport.gui:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "whsport"
module-root = "src"
